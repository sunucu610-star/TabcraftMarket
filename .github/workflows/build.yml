name: Build TabCraftMarket
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin
        run: mvn -B clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TabCraftMarket
          path: target/TabCraftMarket-1.0.0.jar